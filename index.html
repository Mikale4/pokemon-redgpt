<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pokémon RedGPT — Competitive Battle Sandbox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="screen-title" class="screen active"></section>

    <section id="screen-main" class="screen">
      <header class="topbar">
        <div class="brand">POKÉMON <span>REDGPT</span></div>
        <nav class="topnav" id="topnav"></nav>
        <div class="status" id="topstatus"></div>
      </header>
      <main id="view"></main>
    </section>
  </div>

  <div id="modal" class="modal-backdrop hidden">
    <div class="modal-card" id="modalCard">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="fileInput" type="file" accept="application/json,text/plain" hidden>

  <script src="data/game-data.js"></script>
  <script src="src/core/rng.js"></script>
  <script src="src/core/dex.js"></script>
  <script src="src/core/pokemon.js"></script>
  <script src="src/core/abilities.js"></script>
  <script src="src/core/items.js"></script>
  <script src="src/core/formats.js"></script>
  <script src="src/core/mechanics.js"></script>
  <script src="src/core/ai.js"></script>
  <script src="src/core/battle.js"></script>
  <script src="src/core/validation.js"></script>
  <script src="src/core/teamtext.js"></script>
  <script src="src/core/store.js"></script>
  <script src="src/arena/random-teams.js"></script>
  <script src="src/arena/calculator.js"></script>
  <script src="src/campaign/content.js"></script>
  <script src="src/campaign/map.js"></script>
  <script src="src/campaign/run.js"></script>
  <script src="src/campaign/advisor.js"></script>
  <script src="src/ui/common.js"></script>
  <script src="src/ui/battle-ui.js"></script>
  <script src="src/ui/team-builder.js"></script>
  <script src="src/ui/dex-ui.js"></script>
  <script src="src/ui/calc-ui.js"></script>
  <script src="src/ui/arena-ui.js"></script>
  <script src="src/ui/campaign-ui.js"></script>
  <script src="src/ui/app.js"></script>
</body>
</html>
